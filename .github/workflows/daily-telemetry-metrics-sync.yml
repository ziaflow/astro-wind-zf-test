name: Daily Metrics & Telemetry Synchronizer

on:
  schedule:
    # Runs daily at 03:00 UTC (20:00 Phoenix MST)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_gsc_backfill:
        description: 'Force GSC/GA4 backfill date (YYYY-MM-DD)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-telemetry-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Clarity, IndexNow, Bing, GSC & GA4
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Execute Unified Daily Metrics Sync
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: node scripts/sync-all-metrics.mjs

      - name: Validate Telemetry Freshness
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-telemetry-freshness.mjs

