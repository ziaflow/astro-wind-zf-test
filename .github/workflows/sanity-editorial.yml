name: Sanity editorial checks
on:
  pull_request:
    paths:
      - 'src/lib/sanity-editorial.ts'
      - 'src/pages/posts/**'
      - 'src/components/blog/PostByline.astro'
      - 'studio-gemini-blog/schemaTypes/**'
      - 'tests/sanity-editorial*.mjs'
      - '.github/workflows/sanity-editorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types tests/sanity-editorial.test.mjs
      - run: npm ci --legacy-peer-deps --ignore-scripts
        working-directory: studio-gemini-blog
      - run: node --experimental-strip-types tests/sanity-editorial-schema.test.mjs
      - run: ../node_modules/.bin/tsc --noEmit --skipLibCheck --target ES2022 --module esnext --moduleResolution bundler schemaTypes/postType.ts schemaTypes/author.ts
        working-directory: studio-gemini-blog
