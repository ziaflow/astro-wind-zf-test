name: Check Canonical Telemetry Freshness

on:
  schedule:
    # Run daily at 02:00 UTC (19:00 Phoenix MST)
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check-telemetry-freshness.mjs'
      - 'tests/telemetry-freshness.test.mjs'
      - '.github/workflows/telemetry-sync.yml'

permissions:
  contents: read

jobs:
  telemetry-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Test freshness rules without network access
        run: node --test tests/telemetry-freshness.test.mjs
      - name: Check existing Supabase snapshots (no provider export)
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-telemetry-freshness.mjs
