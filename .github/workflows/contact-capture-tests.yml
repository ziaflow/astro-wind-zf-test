name: Contact capture tests
on:
  push:
    paths:
      - 'src/pages/api/contact.ts'
      - 'src/lib/contact-intake.ts'
      - 'tests/contact-capture.test.mjs'
      - '.github/workflows/contact-capture-tests.yml'
  pull_request:
    paths:
      - 'src/pages/api/contact.ts'
      - 'src/lib/contact-intake.ts'
      - 'tests/contact-capture.test.mjs'
      - '.github/workflows/contact-capture-tests.yml'
permissions:
  contents: read
jobs:
  contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/contact-capture.test.mjs
