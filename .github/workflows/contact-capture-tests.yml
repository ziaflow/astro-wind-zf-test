name: Contact capture tests
on:
  push:
    paths:
      - 'src/pages/api/contact.ts'
      - 'tests/contact-capture.test.mjs'
      - '.github/workflows/contact-capture-tests.yml'
  pull_request:
    paths:
      - 'src/pages/api/contact.ts'
      - 'tests/contact-capture.test.mjs'
      - '.github/workflows/contact-capture-tests.yml'
permissions:
  contents: read
jobs:
  contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --test tests/contact-capture.test.mjs
