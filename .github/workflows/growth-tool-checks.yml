name: Growth tool checks
on:
  pull_request:
    paths:
      - 'src/lib/growth-tools/**'
      - 'tests/growth-tools.test.mjs'
      - '.github/workflows/growth-tool-checks.yml'
permissions:
  contents: read
jobs:
  calculations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/growth-tools.test.mjs
