name: AI Blogger Agent

on:
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  agent-blog:
    runs-on: ubuntu-latest

    env:
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_PROJECT_ID: "92p0tpps"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
      BLOGGER_PROVIDER: ${{ vars.BLOGGER_PROVIDER }}
      BLOGGER_MODEL: ${{ vars.BLOGGER_MODEL }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Test provider configuration (no external requests)
        run: node --test tests/blogger-config.test.mjs

      - name: Run AI Agent
        run: npx tsx scripts/ai-blogger.ts
