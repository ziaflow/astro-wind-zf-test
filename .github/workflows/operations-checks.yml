name: Operations control checks
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'tools/operations/**'
      - 'tools/agents/dispatch-weekly-report.mjs'
      - 'tests/operations.test.mjs'
      - 'tests/contact-endpoint.test.mjs'
      - 'tests/audit-endpoint.test.mjs'
      - 'tests/delivery.test.mjs'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/operations-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: 'npm'
      - run: npm ci
      - run: npm run test:workflows
