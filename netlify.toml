[build]
  publish = "dist"
  command = "npm run build"
[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "http://ziaflow.com/*"
  to = "https://ziaflow.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.ziaflow.com/*"
  to = "https://ziaflow.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/web-development-in-2026-a-practical-guide-to-building-fast-secure-highconverting-websites"
  to = "/web-development-in-2026-a-practical-guide-to-building-fast-secure-conversion-ready-websites"
  status = 301

[[redirects]]
  from = "/web-development-in-2026-a-practical-guide-to-building-fast-secure-high-converting-websites"
  to = "/web-development-in-2026-a-practical-guide-to-building-fast-secure-conversion-ready-websites"
  status = 301

[[redirects]]
