worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # 301 Redirect HTTP -> HTTPS
    server {
        listen 80;
        server_name ziaflow.com www.ziaflow.com;
        return 301 https://ziaflow.com$request_uri;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html index.htm;
        include /etc/nginx/mime.types;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        # Redirect HTTP to HTTPS if forwarded behind CDN/proxy
        if ($http_x_forwarded_proto = "http") {
            return 301 https://ziaflow.com$request_uri;
        }

        # 301 Redirect duplicate Web Dev 2026 guide to canonical
        location = /web-development-in-2026-a-practical-guide-to-building-fast-secure-highconverting-websites {
            return 301 /web-development-in-2026-a-practical-guide-to-building-fast-secure-conversion-ready-websites;
        }
        location = /web-development-in-2026-a-practical-guide-to-building-fast-secure-high-converting-websites {
            return 301 /web-development-in-2026-a-practical-guide-to-building-fast-secure-conversion-ready-websites;
        }
        location = /web-development-in-2026-a-practical-guide-to-building-faster-safer-conversion-ready-websites {
            return 301 /web-development-in-2026-a-practical-guide-to-building-fast-secure-conversion-ready-websites;
        }

        # 301 Redirect duplicate Case Study slug to /case-studies/
        location = /phoenix-commercial-hvac-lead-intake {
            return 301 /case-studies/phoenix-commercial-hvac-lead-intake;
        }

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        location / {
            try_files $uri $uri/index.html =404;
        }
    }
}